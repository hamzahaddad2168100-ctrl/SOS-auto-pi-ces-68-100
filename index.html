
 <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOS AUTO PIÈCES 68</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background:#17181A; color:#EDEEEF; }
  input, select, button { font-family: 'Inter', sans-serif; }
  ::placeholder { color: #6B6E74; }
  button { cursor: pointer; }
  .card { background:#1F2124; border:1px solid #34373C; border-radius:10px; padding:16px; }
  .btn-accent { background:#FF6A1A; color:#1a1108; border:none; border-radius:8px; padding:10px 16px; font-weight:700; font-size:14px; }
  .btn-ghost { background:#1F2124; color:#9A9CA2; border:1px solid #34373C; border-radius:8px; padding:10px 16px; font-size:14px; }
  .input { background:#1B1D20; border:1px solid #3E4146; border-radius:7px; color:#EDEEEF; padding:9px 10px; width:100%; font-size:14px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .stat { flex:1; min-width:140px; }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; text-transform:uppercase; }
  .modal-overlay { position:fixed; inset:0; background:rgba(10,10,11,0.75); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal { background:#26282C; border:1px solid #34373C; border-radius:12px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; }
  .field label { display:block; color:#9A9CA2; font-size:11px; text-transform:uppercase; margin-bottom:5px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#9A9CA2;">
    Chargement…
  </div>
</div>

<script>
window.onerror = function(msg, url, line, col, error) {
  document.getElementById('root').innerHTML =
    '<div style="background:#2a0f0f;color:#ffb4b4;padding:20px;font-family:monospace;font-size:14px;white-space:pre-wrap;min-height:100vh;">' +
    '\u26a0\ufe0f ERREUR D\u00c9TECT\u00c9E :\n\n' + msg + '\n\nLigne : ' + line + '\n\nMerci de faire une capture de cet \u00e9cran.' +
    '</div>';
  return false;
};
</script>

<script>
var e = React.createElement;
var useState = React.useState;
var useEffect = React.useEffect;
var useMemo = React.useMemo;

// URL de ton d\u00e9ploiement Apps Script (doit finir par /exec)
var API_URL = "https://script.google.com/macros/s/AKfycbx-tzb_0VyVIexOVeOET_NA7gvhau1dNe8OmrJRtin9YuXKQGBU8gw4zYMJ2diKtjvp/exec";

var PALETTE = ["#E5534B", "#FF6A1A", "#5B8DEF", "#F2B705", "#7C8B99", "#4CAF7D", "#A78BFA", "#9CA3AF", "#22C1C3", "#EC4899", "#84CC16", "#38BDF8"];
var INITIAL_CATEGORIES = [
  { label: "Freinage", color: "#E5534B" }, { label: "Moteur", color: "#FF6A1A" },
  { label: "Carrosserie", color: "#5B8DEF" }, { label: "\u00c9lectricit\u00e9", color: "#F2B705" },
  { label: "Pneumatique", color: "#7C8B99" }, { label: "Filtration", color: "#4CAF7D" },
  { label: "Suspension", color: "#A78BFA" }, { label: "\u00c9chappement", color: "#9CA3AF" }
];
var emptyForm = { ref:"", nom:"", categorie:"", marque:"", modele:"", qte:0, seuil:1, prixAchat:0, prixVente:0, emplacement:"", fournisseur:"", affectation:"", plaque:"" };

function catInfoFor(categories, label) {
  var found = categories.find(function(c){ return c.label.toLowerCase() === (label||"").toLowerCase(); });
  return found || { label: label || "Sans cat\u00e9gorie", color: "#6B6E74" };
}

function StatCard(props) {
  return e('div', { className:'card stat' },
    e('div', { style:{color:'#9A9CA2', fontSize:11, textTransform:'uppercase', marginBottom:8} }, props.label),
    e('div', { style:{fontFamily:"'Barlow Condensed',sans-serif", fontSize:28, fontWeight:700} }, props.value),
    props.sub ? e('div', { style:{color:'#6B6E74', fontSize:12, marginTop:4} }, props.sub) : null
  );
}

function PartCard(props) {
  var p = props.p;
  var cat = catInfoFor(props.categories, p.categorie);
  var low = Number(p.qte) <= Number(p.seuil);
  var marge = (Number(p.prixVente)||0) - (Number(p.prixAchat)||0);
  var assigned = p.affectation && String(p.affectation).trim().length > 0;

  return e('div', { className:'card', style:{borderColor: low ? '#E5534B88' : '#34373C'} },
    e('div', { style:{fontFamily:"'JetBrains Mono',monospace", color:'#FF6A1A', fontSize:12} }, p.ref),
    e('div', { style:{fontFamily:"'Barlow Condensed',sans-serif", fontSize:20, fontWeight:700, marginTop:2} }, p.nom),
    e('div', { style:{marginTop:8} },
      e('span', { className:'badge', style:{background:cat.color+'22', color:cat.color, border:'1px solid '+cat.color+'55'} }, cat.label),
      e('span', { style:{color:'#6B6E74', fontSize:12, marginLeft:8} }, (p.marque||'') + (p.modele && p.modele !== '\u2014' ? ' \u00b7 '+p.modele : ''))
    ),
    e('div', { style:{marginTop:8} },
      e('span', { className:'badge', style:{background: assigned ? '#F2B70522':'#4CAF7D22', color: assigned ? '#F2B705':'#4CAF7D'} },
        assigned ? p.affectation : 'Stock libre')
    ),
    p.emplacement ? e('div', { style:{marginTop:8, color:'#9A9CA2', fontSize:12} }, '\ud83d\udccd ' + p.emplacement + (p.fournisseur ? ' \u00b7 '+p.fournisseur : '')) : null,
    e('div', { style:{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginTop:12} },
      e('div', null,
        e('div', { style:{color:'#6B6E74', fontSize:10, textTransform:'uppercase'} }, 'Stock'),
        e('div', { style:{fontFamily:"'JetBrains Mono',monospace", fontSize:20, fontWeight:700, color: low ? '#E5534B':'#EDEEEF'} },
          p.qte, e('span', { style:{color:'#6B6E74', fontSize:12} }, ' / seuil '+p.seuil))
      ),
      e('div', { style:{textAlign:'right'} },
        e('div', { style:{fontFamily:"'JetBrains Mono',monospace", fontSize:16} }, Number(p.prixVente).toFixed(2)+' \u20ac'),
        e('div', { style:{color:'#4CAF7D', fontSize:11} }, '+'+marge.toFixed(2)+' \u20ac marge')
      )
    ),
    e('div', { style:{display:'flex', justifyContent:'flex-end', gap:8, marginTop:12, borderTop:'1px solid #34373C', paddingTop:10} },
      props.confirming ?
        e('div', { style:{display:'flex', alignItems:'center', gap:8} },
          e('span', { style:{fontSize:12, color:'#9A9CA2'} }, 'Supprimer ?'),
          e('button', { className:'btn-ghost', style:{padding:'6px 10px', borderRadius:6, fontSize:12}, onClick:props.onCancelDelete }, 'Annuler'),
          e('button', { style:{background:'#E5534B', color:'#fff', border:'none', padding:'6px 10px', borderRadius:6, fontSize:12}, onClick:props.onConfirmDelete }, 'Confirmer')
        ) :
        e(React.Fragment, null,
          e('button', { className:'btn-ghost', style:{padding:'6px 10px', borderRadius:6}, onClick:props.onEdit }, '\u270e'),
          e('button', { className:'btn-ghost', style:{padding:'6px 10px', borderRadius:6}, onClick:props.onDelete }, '\ud83d\uddd1')
        )
    )
  );
}

function Field(label, input) {
  return e('div', { className:'field' }, e('label', null, label), input);
}

function PartModal(props) {
  var st = useState(props.initial);
  var form = st[0], setForm = st[1];
  var isEdit = !!form.id;

  function set(k) { return function(ev){ var next = {}; next[k] = ev.target.value; setForm(Object.assign({}, form, next)); }; }
  function setNum(k) { return function(ev){ var next = {}; next[k] = ev.target.value === '' ? '' : Number(ev.target.value); setForm(Object.assign({}, form, next)); }; }

  var valid = form.ref && String(form.ref).trim() && form.nom && String(form.nom).trim() && form.categorie && String(form.categorie).trim() && form.qte !== '' && form.seuil !== '';

  return e('div', { className:'modal-overlay', onClick:props.onClose },
    e('div', { className:'modal', onClick:function(ev){ ev.stopPropagation(); } },
      e('div', { style:{padding:'16px 20px', borderBottom:'1px solid #34373C', display:'flex', justifyContent:'space-between', alignItems:'center'} },
        e('h2', { style:{fontFamily:"'Barlow Condensed',sans-serif", fontSize:22, margin:0} }, isEdit ? 'Modifier la pi\u00e8ce' : 'Nouvelle pi\u00e8ce'),
        e('button', { className:'btn-ghost', style:{padding:'4px 10px', borderRadius:6}, onClick:props.onClose }, '\u2715')
      ),
      e('div', { style:{padding:20, display:'grid', gridTemplateColumns:'1fr 1fr', gap:12} },
        Field('R\u00e9f\u00e9rence *', e('input', { className:'input', value:form.ref||'', onChange:set('ref'), placeholder:'FRE-2201' })),
        Field('Cat\u00e9gorie *', e('input', { className:'input', value:form.categorie||'', onChange:set('categorie'), placeholder:'Freinage, Turbo\u2026', list:'cats' })),
        e('datalist', { id:'cats' }, props.categories.map(function(c){ return e('option', { key:c.label, value:c.label }); })),
        e('div', { style:{gridColumn:'1 / -1'} }, Field('D\u00e9signation *', e('input', { className:'input', value:form.nom||'', onChange:set('nom'), placeholder:'Plaquettes de frein avant' }))),
        Field('Marque', e('input', { className:'input', value:form.marque||'', onChange:set('marque') })),
        Field('Mod\u00e8le', e('input', { className:'input', value:form.modele||'', onChange:set('modele') })),
        Field('Emplacement', e('input', { className:'input', value:form.emplacement||'', onChange:set('emplacement') })),
        Field('Fournisseur', e('input', { className:'input', value:form.fournisseur||'', onChange:set('fournisseur') })),
        e('div', { style:{gridColumn:'1 / -1'} }, Field('Affectation (client / OR / v\u00e9hicule)', e('input', { className:'input', value:form.affectation||'', onChange:set('affectation') }))),
        e('div', { style:{gridColumn:'1 / -1'} }, Field("Plaque d'immatriculation", e('input', { className:'input', value:form.plaque||'', onChange:function(ev){ setForm(Object.assign({}, form, { plaque: ev.target.value.toUpperCase() })); } }))),
        Field('Quantit\u00e9 en stock *', e('input', { type:'number', className:'input', value:form.qte, onChange:setNum('qte') })),
        Field("Seuil d'alerte *", e('input', { type:'number', className:'input', value:form.seuil, onChange:setNum('seuil') })),
        Field("Prix d'achat (\u20ac)", e('input', { type:'number', step:'0.01', className:'input', value:form.prixAchat, onChange:setNum('prixAchat') })),
        Field('Prix de vente (\u20ac)', e('input', { type:'number', step:'0.01', className:'input', value:form.prixVente, onChange:setNum('prixVente') }))
      ),
      e('div', { style:{padding:16, borderTop:'1px solid #34373C', display:'flex', justifyContent:'flex-end', gap:10} },
        e('button', { className:'btn-ghost', onClick:props.onClose }, 'Annuler'),
        e('button', { className:'btn-accent', style:{opacity: valid?1:0.4}, disabled:!valid, onClick:function(){
            if(!valid) return;
            var final = Object.assign({}, form, {
              categorie: String(form.categorie).trim(),
              qte: Number(form.qte)||0, seuil: Number(form.seuil)||1,
              prixAchat: Number(form.prixAchat)||0, prixVente: Number(form.prixVente)||0
            });
            props.onSave(final);
          }
        }, isEdit ? 'Enregistrer' : 'Ajouter la pi\u00e8ce')
      )
    )
  );
}

function App() {
  var s1 = useState([]); var parts = s1[0], setParts = s1[1];
  var s2 = useState(INITIAL_CATEGORIES); var categories = s2[0], setCategories = s2[1];
  var s3 = useState(''); var query = s3[0], setQuery = s3[1];
  var s4 = useState('all'); var cat = s4[0], setCat = s4[1];
  var s5 = useState(false); var onlyLow = s5[0], setOnlyLow = s5[1];
  var s6 = useState(null); var modal = s6[0], setModal = s6[1];
  var s7 = useState(null); var confirmId = s7[0], setConfirmId = s7[1];
  var s8 = useState(true); var loading = s8[0], setLoading = s8[1];
  var s9 = useState(true); var storageOk = s9[0], setStorageOk = s9[1];
  var s10 = useState('idle'); var syncState = s10[0], setSyncState = s10[1];

  function persist(nextParts, nextCategories) {
    setSyncState('saving');
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'save', parts: nextParts, categories: nextCategories })
    }).then(function(){
      setSyncState('saved'); setStorageOk(true);
      setTimeout(function(){ setSyncState('idle'); }, 2000);
    }).catch(function(){
      setSyncState('error'); setStorageOk(false);
    });
  }

  function loadFromServer() {
    setLoading(true);
    fetch(API_URL).then(function(r){ return r.json(); }).then(function(data){
      setParts(Array.isArray(data.parts) ? data.parts : []);
      setCategories(Array.isArray(data.categories) && data.categories.length ? data.categories : INITIAL_CATEGORIES);
      setStorageOk(true);
    }).catch(function(){
      setParts([]); setCategories(INITIAL_CATEGORIES); setStorageOk(false);
    }).finally(function(){ setLoading(false); });
  }

  useEffect(function(){ loadFromServer(); }, []);

  var filtered = useMemo(function(){
    return parts.filter(function(p){
      if (cat !== 'all' && String(p.categorie).toLowerCase() !== cat.toLowerCase()) return false;
      if (onlyLow && Number(p.qte) > Number(p.seuil)) return false;
      var q = query.trim().toLowerCase();
      if (q) {
        var hay = [p.ref,p.nom,p.marque,p.modele,p.affectation,p.plaque,p.categorie].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }, [parts, query, cat, onlyLow]);

  var stats = useMemo(function(){
    var valeur = parts.reduce(function(s,p){ return s + (Number(p.qte)||0)*(Number(p.prixAchat)||0); }, 0);
    var unites = parts.reduce(function(s,p){ return s + (Number(p.qte)||0); }, 0);
    var alertes = parts.filter(function(p){ return Number(p.qte) <= Number(p.seuil); }).length;
    return { refs: parts.length, valeur:valeur, unites:unites, alertes:alertes };
  }, [parts]);

  function resolveCategory(name, currentCategories) {
    var existing = currentCategories.find(function(c){ return c.label.toLowerCase() === name.toLowerCase(); });
    if (existing) return { label: existing.label, categories: currentCategories };
    var color = PALETTE[currentCategories.length % PALETTE.length];
    return { label: name, categories: currentCategories.concat([{ label:name, color:color }]) };
  }

  function save(data) {
    var r = resolveCategory(data.categorie, categories);
    var finalData = Object.assign({}, data, { categorie: r.label });
    var newParts;
    if (finalData.id) {
      newParts = parts.map(function(p){ return p.id === finalData.id ? finalData : p; });
    } else {
      var maxId = parts.reduce(function(m,p){ return Math.max(m, Number(p.id)||0); }, 0);
      finalData.id = maxId + 1;
      newParts = parts.concat([finalData]);
    }
    setCategories(r.categories);
    setParts(newParts);
    setModal(null);
    persist(newParts, r.categories);
  }

  function remove(id) {
    var newParts = parts.filter(function(p){ return p.id !== id; });
    setParts(newParts);
    setConfirmId(null);
    persist(newParts, categories);
  }

  if (loading) {
    return e('div', { style:{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:'#9A9CA2'} }, 'Chargement du stock\u2026');
  }

  return e('div', null,
    e('div', { style:{borderBottom:'1px solid #34373C', padding:'16px 16px 10px'} },
      e('div', { style:{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10} },
        e('div', { style:{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:24} }, 'SOS AUTO PI\u00c8CES ', e('span',{style:{color:'#FF6A1A'}},'68')),
        e('div', { style:{display:'flex', gap:8} },
          e('button', { className:'btn-ghost', onClick:loadFromServer }, '\ud83d\udd04 Actualiser'),
          e('button', { className:'btn-accent', onClick:function(){ setModal(emptyForm); } }, '+ Nouvelle pi\u00e8ce')
        )
      ),
      e('div', { style:{marginTop:8, fontSize:11.5, color: storageOk ? '#6B6E74' : '#E5534B'} },
        storageOk ? ('Stock synchronis\u00e9 avec Google Sheets' + (syncState==='saving' ? ' \u00b7 enregistrement\u2026' : syncState==='saved' ? ' \u00b7 \u00e0 jour' : '')) : 'Impossible de joindre le serveur.'
      )
    ),
    e('div', { style:{padding:16, maxWidth:1100, margin:'0 auto'} },
      e('div', { className:'stats' },
        e(StatCard, { label:'R\u00e9f\u00e9rences', value:stats.refs }),
        e(StatCard, { label:'Unit\u00e9s en stock', value:stats.unites }),
        e(StatCard, { label:'Valeur du stock', value: stats.valeur.toLocaleString('fr-FR',{maximumFractionDigits:0})+' \u20ac', sub:"au prix d'achat" }),
        e(StatCard, { label:'Alertes stock bas', value: stats.alertes, sub: stats.alertes>0 ? '\u00e0 r\u00e9approvisionner' : 'rien \u00e0 signaler' })
      ),
      e('div', { className:'toolbar' },
        e('input', { className:'input', style:{flex:1, minWidth:200}, placeholder:'Rechercher\u2026', value:query, onChange:function(ev){ setQuery(ev.target.value); } }),
        e('select', { className:'input', style:{maxWidth:200}, value:cat, onChange:function(ev){ setCat(ev.target.value); } },
          e('option', { value:'all' }, 'Toutes cat\u00e9gories'),
          categories.map(function(c){ return e('option', { key:c.label, value:c.label }, c.label); })
        ),
        e('button', { className:'btn-ghost', style:{background: onlyLow ? '#E5534B22':'', color: onlyLow?'#E5534B':''}, onClick:function(){ setOnlyLow(!onlyLow); } }, '\u26a0\ufe0f Alertes uniquement')
      ),
      filtered.length === 0 ?
        e('div', { style:{textAlign:'center', padding:'60px 0', color:'#9A9CA2', border:'1px dashed #34373C', borderRadius:12} }, 'Aucune pi\u00e8ce trouv\u00e9e.') :
        e('div', { className:'grid' },
          filtered.map(function(p){
            return e(PartCard, {
              key:p.id, p:p, categories:categories,
              onEdit:function(){ setModal(p); },
              onDelete:function(){ setConfirmId(p.id); },
              confirming: confirmId === p.id,
              onConfirmDelete:function(){ remove(p.id); },
              onCancelDelete:function(){ setConfirmId(null); }
            });
          })
        )
    ),
    modal ? e(PartModal, { initial: modal.id ? modal : emptyForm, categories:categories, onClose:function(){ setModal(null); }, onSave:save }) : null
  );
}

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
</body>
</html>
